<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#777}
.bg{background:radial-gradient(circle at 85% 0%,#2b4185 0%,#1b2a5b 45%,#0e1a3d 100%);color:#fff;font-family:Inter,sans-serif;position:relative;overflow:hidden;margin-bottom:30px}
.bar{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(90deg,#43a047 0 25%,#1e88e5 25% 50%,#fb8c00 50% 75%,#e53935 75%)}
.wm{font:900 Montserrat}.h{color:#3fb7c9}.e{color:#ff5a5f}
/* Facebook cover 1640x624; mobile shows the middle ~1110px */
#cover{width:1640px;height:624px}
#cover .safe{position:absolute;left:265px;right:265px;top:0;bottom:0;display:grid;grid-template-columns:1fr 470px;gap:40px;align-items:center;padding:0 10px}
#cover h1{font:900 76px/1.02 Montserrat;margin:10px 0 0}#cover h1 span{color:#ff6b6f}
#cover .k{text-transform:uppercase;letter-spacing:.16em;font-weight:700;font-size:21px;color:#9fd6df}
#cover p{font-size:25px;color:#d5ddf0;margin:16px 0 0;line-height:1.4}
.mon{background:#060b16;border:2px solid #24304d;border-radius:22px;padding:16px 18px;position:relative}
.mon .lab{font-size:15px;letter-spacing:.12em;color:#3dff8f;opacity:.75}
.mon .hr{position:absolute;right:22px;top:6px;font:800 46px Montserrat;color:#3dff8f;text-shadow:0 0 16px rgba(61,255,143,.5)}
.mon .hr small{font-size:18px;margin-left:5px}
.pill{display:inline-block;font-weight:700;font-size:20px;padding:9px 16px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);margin:20px 8px 0 0}
.free{background:#3dff8f;color:#0e1a3d;border:0}
/* profile picture */
#profile{width:1080px;height:1080px;background:#fff;display:grid;place-items:center;margin-bottom:30px}
#profile img{width:800px}
/* highlight covers 1080x1920: icon centered (shown as a circle) */
.hl{width:1080px;height:1920px;display:grid;place-items:center;margin-bottom:30px;font-family:Inter,sans-serif}
.hl .ring{width:640px;height:640px;border-radius:50%;display:grid;place-items:center;text-align:center;color:#fff}
.hl svg{width:560px;height:560px;stroke:#fff;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.hl .t{font:900 64px Montserrat;margin-top:10px;letter-spacing:.02em}
</style></head><body>

<div class="bg" id="cover">
  <div class="safe">
    <div>
      <div class="k">For EMS &amp; paramedic students</div>
      <h1>Basic ECG<br><span>Interpretation</span></h1>
      <p>Self-paced, narrated rhythm course with live practice ECGs, quizzes and a certificate.</p>
      <span class="pill free">Unit 1 free</span><span class="pill">$49 · 12 months</span>
    </div>
    <div class="mon"><div class="lab">II · ECG</div><div class="hr"><span id="hr-cover"></span><small>bpm</small></div><canvas id="c-cover"></canvas></div>
  </div>
  <div class="bar" style="height:10px"></div>
</div>

<div id="profile"><img src="emblem.png"></div>

<div id="highlights"></div>

<script src="ecg-engine.js"></script><script src="ecg-render.js"></script>
<script>
var sig = ECGEngine.generate('nsr', 21, 12);
ECGRender.drawStrip(document.getElementById('c-cover'), sig, { leads: ['II'], mode: 'monitor', width: 430, seconds: 3, bandMM: 22, compact: true });
var qs = sig.qrsTimes.filter(function (t) { return t < 3; });
document.getElementById('hr-cover').textContent = Math.round(60 * (qs.length - 1) / (qs[qs.length - 1] - qs[0]));

var ICONS = {
  start: '<path d="M8 5v14l11-7z"/>',
  course: '<path d="M2 5c3-1.5 7-1.5 10 1 3-2.5 7-2.5 10-1v14c-3-1.5-7-1.5-10 1-3-2.5-7-2.5-10-1z"/><path d="M12 6v14"/>',
  rhythms: '<path d="M1 13h5l2-4 3 9 3-14 2.5 9H23"/>',
  tips: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  quiz: '<circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.4-2.7 4"/><circle cx="12" cy="17.6" r=".4" fill="#fff"/>',
  cert: '<circle cx="12" cy="9" r="6"/><path d="M8.5 13.8 7 22l5-3 5 3-1.5-8.2"/><path d="m9.6 9 1.6 1.6 3.2-3.2"/>',
  faq: '<path d="M21 12a8.5 8.5 0 0 1-12.4 7.6L3 21l1.4-5.4A8.5 8.5 0 1 1 21 12z"/><path d="M8 10.5h8M8 14h5"/>'
};
var HL = [['start','Start here','#e0262b'],['course','Course','#1b2a5b'],['rhythms','Rhythms','#16a34a'],['tips','ECG tips','#fb8c00'],['quiz','Quiz','#1e88e5'],['cert','Certificate','#7c3aed'],['faq','FAQ','#0e7490']];
document.getElementById('highlights').innerHTML = HL.map(function (h) {
  return '<div class="hl" id="hl-' + h[0] + '" style="background:' + h[2] + '"><div class="ring"><div><svg viewBox="0 0 24 24">' + ICONS[h[0]] + '</svg></div></div></div>';
}).join('');
document.title = 'ready';
</script></body></html>
